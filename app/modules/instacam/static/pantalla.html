<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pantalla — Instacam</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="screen">
  <header class="screen-header">
    <img src="/assets/logo.png" alt="Logo" class="screen-logo" />
    <h1>Instacam</h1>
    <div id="screen-banner" class="screen-banner"></div>
    <button type="button" id="fullscreen-btn" class="secondary">⛶ Pantalla completa</button>
  </header>

  <main class="screen-layout">
    <section>
      <h2 id="boards-title" class="screen-section-title">Murales</h2>
      <div id="screen-boards" class="screen-boards"></div>
    </section>
    <aside>
      <h2 class="screen-section-title">Últimas fotos</h2>
      <div id="screen-feed" class="screen-feed"></div>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/strip.js"></script>
  <script src="/js/corkboard.js"></script>
  <script src="/js/pantalla-page.js"></script>
</body>
</html>
