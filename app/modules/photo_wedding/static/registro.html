<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrate — Fotos de Boda</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <h1>¿Quién sos y en qué mesa estás?</h1>
    <form id="registro-form" class="card">
    <label>
        Tu nombre
        <input type="text" id="display_name" required />
    </label>
    <label>
        Tu mesa
        <select id="mesa_id" required></select>
    </label>
    <p id="error-msg" class="error"></p>
    <button type="submit">Confirmar</button>
    </form>
    <button type="button" id="logout-btn" class="secondary">Cerrar sesión</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/registro-page.js"></script>
</body>
</html>
