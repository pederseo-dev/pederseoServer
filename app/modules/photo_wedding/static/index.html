<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fotos de Boda</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container">
    <img src="/assets/logo.png" alt="Logo" class="login-logo" />
    <h1>Instacam</h1>
    <form id="auth-form" class="card">
      <label>
        Email
        <input type="email" id="email" required autocomplete="email" />
      </label>
      <label>
        Contraseña
        <input type="password" id="password" required autocomplete="current-password" minlength="6" />
      </label>
      <p id="error-msg" class="error"></p>
      <button type="submit" id="login-btn">Entrar</button>
      <button type="button" id="signup-btn" class="secondary">Crear cuenta</button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth-page.js"></script>
</body>
</html>
